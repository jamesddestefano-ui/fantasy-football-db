[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasy-football-db"
version = "0.1.0"
description = "Auditable, league-isolated fantasy-football source of truth"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ffdb = "ffdb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ffdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

