name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'intelligence/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'intelligence/**'
      - 'docs/**'
      - '**/*.md'

# Skip data-only commits (Grok Pulse writes to intelligence/) and cancel superseded runs
# to save Actions minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest
